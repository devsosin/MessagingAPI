[package]
name = "messaging"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

time = { version = "0.3", features = ["formatting", "macros"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }

lettre = { version = "0.11.18", default-features = false, features = [
    "builder",
    "smtp-transport",
    "pool",
    "tokio1",
    "tokio1-native-tls",
], optional = true }

thiserror = "2.0.16"

[dev-dependencies]
dotenv = "0.15.0"

[features]
email = ["lettre"]
aligo = ["dep:reqwest", "reqwest/form", "reqwest/multipart"]
solapi = ["dep:reqwest", "dep:time", "dep:uuid", "dep:hmac", "dep:sha2"]
