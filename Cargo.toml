[package]
name = "messaging"
version = "0.2.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
serde = { version = "1.0.219", features = ["derive"], optional = true }

time = { version = "0.3", features = ["formatting", "macros"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }

lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "smtp-transport",
    "pool",
    "tokio1-rustls",
    "aws-lc-rs",
    "webpki-roots",
], optional = true }

thiserror = "2.0.16"

[dev-dependencies]
dotenv = "0.15.0"
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[features]
email = ["dep:lettre"]
aligo = ["dep:reqwest", "dep:serde", "reqwest/form", "reqwest/multipart"]
solapi = ["dep:reqwest", "dep:serde", "dep:time", "dep:uuid", "dep:hmac", "dep:sha2"]
